server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router handles routing client-side, so any path that isn't a real
  # static file (e.g. /dashboard, /pricing) must still be served index.html
  # — otherwise nginx 404s on a direct load or a page refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed build assets aggressively; index.html itself is not cached
  # so deploys take effect immediately.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
